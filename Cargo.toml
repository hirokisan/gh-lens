[package]
name = "gh-lens"
authors = ["hirokisan <dev@hirokiueno.com>"]
description = "CLI to analyze your activity on GitHub"
version = "0.0.13"
edition = "2021"
license = "MIT"
keywords = ["github", "cli", "analysis", "gh-lens"]
categories = ["command-line-utilities"]
homepage = "https://github.com/hirokisan/gh-lens"
repository = "https://github.com/hirokisan/gh-lens"
readme = "README.md"
rust-version = "1.79.0"

[[bin]]
name = "gh-lens"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
graphql_client = "0.15"
octocrab = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
